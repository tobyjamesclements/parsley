org.slf4j.simpleLogger.defaultLogLevel=warn
# QuietStreamsConfig and MockProcessorContext create StreamsConfig instances from consumer-level
# configs that don't carry processing.exception.handler.global.enabled, re-triggering this one
# warning even when we set the property correctly. StreamsConfig has no other WARN-level output.
org.slf4j.simpleLogger.log.org.apache.kafka.streams.StreamsConfig=error
