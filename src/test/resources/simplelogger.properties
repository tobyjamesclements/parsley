org.slf4j.simpleLogger.defaultLogLevel=warn
# StreamsConfig instances built from consumer-level configs re-trigger one WARN; quieten it.
org.slf4j.simpleLogger.log.org.apache.kafka.streams.StreamsConfig=error
# Tests use an OS temp dir for state.dir on purpose; silence the StateDirectory WARN.
org.slf4j.simpleLogger.log.org.apache.kafka.streams.processor.internals.StateDirectory=error
