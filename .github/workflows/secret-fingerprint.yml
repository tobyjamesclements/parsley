name: Secret fingerprint

# TEMPORARY. Prints only the byte length and an 8-hex SHA-256 prefix of the stored token,
# to compare against the same fingerprint taken locally. Neither value discloses the secret.
# Delete once the comparison is made.
on:
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint stored secret
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          printf 'length: %s\n' "$(printf %s "$TOK" | wc -c | tr -d ' ')"
          printf 'sha256: %s\n' "$(printf %s "$TOK" | sha256sum | cut -c1-8)"
          printf 'has_trailing_whitespace: %s\n' \
            "$([ "$TOK" != "$(printf %s "$TOK" | tr -d '[:space:]')" ] && echo yes || echo no)"
          printf 'prefix_shape: %s\n' "$(printf %s "$TOK" | cut -c1-4 | sed 's/./x/g')"
