name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and test
        run: ./mvnw verify --no-transfer-progress

  # Mutation testing over the whole package, serially: a mutant whose covering tests run
  # slowly under CPU contention exceeds PIT's per-mutant timeout, and PIT counts a timeout
  # as a kill, so parallel runs overstate the score. The score is reported, not gated.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Mutation coverage
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage --no-transfer-progress
      - name: Mutation summary
        if: always()
        run: |
          xml=target/pit-reports/mutations.xml
          if [ -f "$xml" ]; then
            killed=$(grep -c "status='KILLED'" "$xml" || true)
            timed=$(grep -c "status='TIMED_OUT'" "$xml" || true)
            total=$(grep -c "<mutation " "$xml" || true)
            echo "## Mutation coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Detected $((killed + timed)) of $total mutants." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no mutations.xml produced" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pit-report
          path: target/pit-reports/
          if-no-files-found: ignore
