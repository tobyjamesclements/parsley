name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run unit tests
        run: mvn test --no-transfer-progress -pl parsley-api,parsley-core,parsley-crypto-jdk-aes,parsley-kafka

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Install modules
        run: mvn install --no-transfer-progress -DskipTests
      - name: Run integration tests
        run: mvn test --no-transfer-progress -pl parsley-it
