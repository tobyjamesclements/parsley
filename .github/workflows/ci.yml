name: CI

on:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the library declares, and the newest release: the suite runs on both, so
        # "Java 21 or newer" is tested rather than inferred from a --release build.
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and test
        run: ./mvnw clean verify --no-transfer-progress

  javadoc:
    # verify does not build the Javadoc, so a broken {@link} or @see would otherwise surface
    # only when the Javadoc workflow deploys the site after the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build the Javadoc
        run: ./mvnw javadoc:javadoc --no-transfer-progress
