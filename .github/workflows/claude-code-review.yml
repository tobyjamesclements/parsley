name: Claude Code Review

# Reviews on request only, never on every push. Two ways to ask: comment `/code-review` on a
# pull request, or add the `claude-review` label to it.
#
# The trigger phrase deliberately omits `@claude`, because claude.yml fires on any comment
# containing that string and both workflows would answer the same comment. A bot cannot be
# named as a reviewer or assignee -- GitHub allows only collaborators there -- so a comment
# and a label are the two levers available.
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [labeled]

jobs:
  claude-review:
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '/code-review')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.issue.number || github.event.pull_request.number }}'
