name: Broker IT

# The broker smoke suite: failsafe runs the *IT classes against a real broker in Docker.
# A separate workflow on purpose — publish.yml keys off the CI workflow's conclusion, so
# a broker or container failure here never blocks a snapshot.
on:
  push:

jobs:
  broker-it:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - name: Broker smoke tests
        run: ./mvnw clean verify -Pbroker-it --no-transfer-progress
