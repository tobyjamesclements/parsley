name: Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build Javadoc
        run: ./mvnw javadoc:javadoc --no-transfer-progress -DskipTests
      - name: Install MkDocs
        run: pip install mkdocs-material
      - name: Build docs site
        run: mkdocs build
      - name: Fold Javadoc into site
        run: cp -r target/reports/apidocs site/api
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
