name: Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # mike pushes versioned docs to the gh-pages branch

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # mike needs full history to manage gh-pages

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Javadoc
        run: ./mvnw javadoc:javadoc --no-transfer-progress -DskipTests

      - name: Stage Javadoc into docs source
        run: |
          mkdir -p docs/javadoc
          cp -r target/reports/apidocs/. docs/javadoc/

      - name: Generate llms-full.txt
        run: python3 scripts/build-llms-full.py .

      - name: Generate the decisions index
        run: python3 scripts/build-decisions-index.py .
        env:
          PARSLEY_DOCS_REF: ${{ github.sha }}

      - name: Install MkDocs + mike
        run: pip install mkdocs-material mike

      - name: Check the Javadoc index survives the build
        # A page whose name matches the staging directory renders to the same destination, and
        # MkDocs reports no conflict when the page wins — it silently displaces the Javadoc's
        # own index.html. mike builds internally, so build once here and check before anything
        # reaches gh-pages.
        run: |
          mkdocs build --strict --site-dir /tmp/site-check
          if ! grep -q 'name="generator" content="javadoc' /tmp/site-check/javadoc/index.html; then
            echo "::error::javadoc/index.html is not the generated Javadoc index; a docs page has displaced it."
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version and aliases
        id: ver
        run: |
          # Who owns `latest` depends on the major version. Pre-1.0, main is the authoritative
          # tree — releases trail it and can differ incompatibly — so main carries `latest` and
          # tags deploy as pinned versions with no alias. From 1.0.0 that inverts: `latest`
          # follows the newest stable release and main is `dev` only. Prereleases (any tag with
          # a `-suffix`) never take `latest`.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            SNAPSHOT=false
            if [[ "${VERSION%%.*}" -ge 1 && "$VERSION" != *-* ]]; then
              ALIASES=latest
            else
              ALIASES=
            fi
          else
            VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
            SNAPSHOT=true
            if [[ "${VERSION%%.*}" -ge 1 ]]; then
              ALIASES=dev
            else
              ALIASES="dev latest"
            fi
          fi
          echo "version=$VERSION"   >> $GITHUB_OUTPUT
          echo "aliases=$ALIASES"   >> $GITHUB_OUTPUT
          echo "snapshot=$SNAPSHOT" >> $GITHUB_OUTPUT

      - name: Deploy versioned docs
        run: |
          mike deploy --push --update-aliases \
              ${{ steps.ver.outputs.version }} ${{ steps.ver.outputs.aliases }}
          # Point the site default at `latest` whenever this build is the one placing it; a
          # deploy that takes no alias leaves the previous default alone.
          if [[ "${{ steps.ver.outputs.aliases }}" == *latest* ]]; then
            mike set-default --push latest
          fi
          if [[ "${{ steps.ver.outputs.snapshot }}" == "true" ]]; then
            # Garbage-collect superseded snapshot doc versions: keep only this build's snapshot
            # (which now holds the aliases decided above) plus real releases. Dev docs are under
            # the literal X.Y.Z-SNAPSHOT version, so without this every version bump leaves a stale
            # entry behind in the selector. Runs after the deploy above, so the current snapshot is
            # never the one removed.
            keep="${{ steps.ver.outputs.version }}"
            mike list | awk '{print $1}' | grep -- '-SNAPSHOT$' | grep -vx "$keep" \
                | xargs -r mike delete --push || true
          fi

      # mike serves every page under a version prefix, but agents look for /llms.txt and
      # /llms-full.txt at the site root. Publish unversioned copies there, from whichever build
      # owns `latest`, so the root entry points always describe the version the site defaults to.
      - name: Publish root-level agent entry points
        if: contains(steps.ver.outputs.aliases, 'latest')
        run: |
          git fetch origin gh-pages
          git worktree add --force -B gh-pages ../gh-pages-root origin/gh-pages
          cp docs/llms.txt docs/llms-full.txt ../gh-pages-root/
          git -C ../gh-pages-root add llms.txt llms-full.txt
          if git -C ../gh-pages-root diff --cached --quiet; then
            echo "Root entry points already current; nothing to push."
          else
            git -C ../gh-pages-root commit \
                -m "Publish root llms.txt and llms-full.txt for ${{ steps.ver.outputs.version }}"
            git -C ../gh-pages-root push origin gh-pages
          fi
