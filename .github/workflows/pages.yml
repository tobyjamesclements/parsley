name: Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # mike pushes versioned docs to the gh-pages branch

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # mike needs full history to manage gh-pages

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Javadoc
        run: ./mvnw javadoc:javadoc --no-transfer-progress -DskipTests

      - name: Stage Javadoc into docs source
        run: |
          mkdir -p docs/api
          cp -r target/reports/apidocs/. docs/api/

      - name: Install MkDocs + mike
        run: pip install mkdocs-material mike

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version and alias
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "alias=latest" >> $GITHUB_OUTPUT
          else
            POM_VER=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
            echo "version=$POM_VER" >> $GITHUB_OUTPUT
            echo "alias=dev" >> $GITHUB_OUTPUT
          fi

      - name: Deploy versioned docs
        run: |
          mike deploy --push --update-aliases \
              ${{ steps.ver.outputs.version }} ${{ steps.ver.outputs.alias }}
          if [[ "${{ steps.ver.outputs.alias }}" == "latest" ]]; then
            mike set-default --push latest
          else
            # Set dev as default only when no stable release exists yet
            mike list | grep -q "latest" || mike set-default --push dev
          fi
