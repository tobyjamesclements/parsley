name: Docs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # mike pushes versioned docs to the gh-pages branch

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # mike needs full history to manage gh-pages

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build Javadoc
        run: ./mvnw javadoc:javadoc --no-transfer-progress -DskipTests

      - name: Stage Javadoc into docs source
        run: |
          mkdir -p docs/api
          cp -r target/reports/apidocs/. docs/api/

      - name: Install MkDocs + mike
        run: pip install mkdocs-material mike

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version and aliases
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "aliases=latest" >> $GITHUB_OUTPUT
            echo "snapshot=false" >> $GITHUB_OUTPUT
          else
            POM_VER=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
            echo "version=$POM_VER" >> $GITHUB_OUTPUT
            # main is the authoritative tree, so its docs carry `latest` — and with it the site
            # default — as well as `dev`. Released versions stay addressable by version number.
            echo "aliases=dev latest" >> $GITHUB_OUTPUT
            echo "snapshot=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy versioned docs
        run: |
          mike deploy --push --update-aliases \
              ${{ steps.ver.outputs.version }} ${{ steps.ver.outputs.aliases }}
          # Every deploy places `latest`, so the site default can always point at it.
          mike set-default --push latest
          if [[ "${{ steps.ver.outputs.snapshot }}" == "true" ]]; then
            # Garbage-collect superseded snapshot doc versions: keep only this build's snapshot
            # (which now holds `dev` and `latest`) plus real releases. Dev docs are deployed under
            # the literal X.Y.Z-SNAPSHOT version, so without this every version bump leaves a stale
            # entry behind in the selector. Runs after the deploy above, so the current snapshot is
            # never the one removed.
            keep="${{ steps.ver.outputs.version }}"
            mike list | awk '{print $1}' | grep -- '-SNAPSHOT$' | grep -vx "$keep" \
                | xargs -r mike delete --push || true
          fi
