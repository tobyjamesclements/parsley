name: Javadoc

# The GitHub Pages site is the Javadoc of main, nothing else. The MkDocs site that used to
# live on the gh-pages branch was retired with its sources; the Markdown pages under docs/
# are read in the repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build the Javadoc
        # Fails on a broken {@link} or @see, which ./mvnw verify does not check.
        run: ./mvnw javadoc:javadoc --no-transfer-progress
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/reports/apidocs
      - id: deployment
        uses: actions/deploy-pages@v4
