version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/London"

    open-pull-requests-limit: 10

    groups:
      patch-and-minor:
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "dependbot"
      
