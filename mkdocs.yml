site_name: Parsley
site_description: Causal delivery order for Kafka stream processing
repo_url: https://github.com/tobyjamesclements/parsley
repo_name: tobyjamesclements/parsley

# Any warning fails the build. This lives in the config rather than a --strict flag because
# the deploy that matters is `mike deploy` in .github/workflows/pages.yml, and mike has no
# way to pass the flag through: only a config-level setting makes the published build strict.
strict: true

# Raised from their defaults so a link that no longer resolves fails instead of being logged
# and shipped. anchors covers the intra-page `#fragment` targets nothing else checks, and
# nav.omitted_files catches a page added to docs/ but never put in the nav below.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# Javadoc, staged into docs/api by scripts/docs-build.sh and by the Pages workflow. It is a
# generated tree reached through the button on reference/api.md, so it is deliberately absent
# from the nav; without this, nav.omitted_files above would fail every build that stages it.
not_in_nav: |
  api/**

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - Protocol:
    - Model: model.md
    - Delivery: delivery.md
    - State: state.md
    - Wire format: wire-format.md
  - Operation:
    - Failing closed: failing-closed.md
    - Runtime: runtime.md
  - Patterns:
    - Session consistency: session.md
  - Reference:
    - Verification: verification.md
    - API: api.md
