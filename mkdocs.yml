site_name: Parsley
site_description: Causal consistency for Kafka
repo_url: https://github.com/tobyjamesclements/parsley
repo_name: tobyjamesclements/parsley

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Concepts: concepts.md
  - Getting started: getting-started.md
  - Streams integration: streams.md
  - Configuration: configuration.md
  - Performance: performance.md
  - Troubleshooting: troubleshooting.md
  - Migration: migration.md
  - API reference: api/index.html
  - Internals:
    - Overview: internals/overview.md
    - Wire format: internals/wire-format.md
    - The engine: internals/engine.md
    - Streams integration: internals/streams.md
    - Consumer: internals/consumer.md
    - Benchmarks: internals/benchmarks.md
