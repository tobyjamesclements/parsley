site_name: Parsley
site_description: Causal delivery order for Kafka stream processing
repo_url: https://github.com/tobyjamesclements/parsley
repo_name: tobyjamesclements/parsley

# Any warning fails the build. This lives in the config rather than a --strict flag because
# the deploy that matters is `mike deploy` in .github/workflows/pages.yml, and mike has no
# way to pass the flag through: only a config-level setting makes the published build strict.
strict: true

# Raised from their defaults so a link that no longer resolves fails instead of being logged
# and shipped. anchors covers the intra-page `#fragment` targets nothing else checks, and
# nav.omitted_files catches a page added to docs/ but never put in the nav below.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# Javadoc, staged into docs/api by scripts/docs-build.sh and by the Pages workflow. It is a
# generated tree reached through the button on reference/api.md, so it is deliberately absent
# from the nav; without this, nav.omitted_files above would fail every build that stages it.
not_in_nav: |
  api/**

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - Foundations:
    - The causal model: foundations/causal-model.md
    - The delivery gate: foundations/delivery-gate.md
    - Liveness: foundations/liveness.md
  - Design:
    - Architecture: design/architecture.md
    - State and recovery: design/state.md
    - Verification: design/verification.md
  - Using Parsley:
    - Getting started: guide/getting-started.md
    - Topology shapes: guide/topologies.md
    - Codecs and Avro: guide/codecs.md
    - Error handling: guide/error-handling.md
    - Ticks: guide/ticks.md
    - The contract: guide/expectations.md
    - Diagnosing held records: guide/diagnosing-holds.md
    - Verifying your application: guide/verifying.md
    - Plain clients: guide/clients.md
  - Reference:
    - Wire format: reference/wire-format.md
    - Conformance kit: reference/conformance-kit.md
    - Metrics: reference/metrics.md
    - API reference: reference/api.md
