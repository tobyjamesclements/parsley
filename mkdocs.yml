site_name: Parsley
site_description: Causal consistency for Kafka
repo_url: https://github.com/tobyjamesclements/parsley
repo_name: tobyjamesclements/parsley

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Foundations:
    - Causal consistency: foundations/causal-consistency.md
    - The delivery gate: foundations/delivery-gate.md
    - Environmental assumptions: foundations/assumptions.md
    - Named invariants: foundations/invariants.md
  - The three protocols:
    - Overview: protocols/index.md
    - 1 · Channels: protocols/channels.md
    - 2 · Causal broadcast: protocols/causal-broadcast.md
    - 3 · Gossip: protocols/gossip.md
  - Using Parsley:
    - Getting started: guide/getting-started.md
    - Streams integration: guide/streams.md
    - Incremental adoption: guide/adoption.md
    - Configuration: guide/configuration.md
    - Troubleshooting: guide/troubleshooting.md
  - Reference:
    - The processor: reference/processor.md
    - Wire format: reference/wire-format.md
    - Naming: reference/naming.md
    - Bibliography: reference/bibliography.md
    - API reference: api/index.html
